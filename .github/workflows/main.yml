
name: Build Orbit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Orbit_Responsive_Fixed_Source_v1.1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept SDK licenses and install packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract latest Orbit source
        shell: bash
        run: |
          test -f Orbit_Responsive_Fixed_Source_v1.1.zip
          mkdir -p source
          unzip -q Orbit_Responsive_Fixed_Source_v1.1.zip \
            -d source

          test -f source/settings.gradle
          test -f source/build.gradle
          test -f source/app/build.gradle
          test -f source/app/src/main/AndroidManifest.xml

          echo "Source project verified."
          echo "Project files:"
          find source -maxdepth 2 -type f | sort

      - name: Build debug APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="source/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload Orbit APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Responsive-v1.1-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
