
name: Build Orbit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbit_Responsive_Fixed_Source_v1.1.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract new source ZIP
        run: |
          mkdir -p source
          unzip -q Orbit_Responsive_Fixed_Source_v1.1.zip -d source
          echo "Files inside ZIP:"
          find source -maxdepth 4 -type f | head -200
          echo "Searching for Gradle project..."
          find source -type f \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Locate Android project
        id: project
        run: |
          SETTINGS=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Android Gradle project found in ZIP."
            echo "The ZIP structure must be checked before building an APK."
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
