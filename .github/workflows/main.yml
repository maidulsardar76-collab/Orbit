
name: Build Orbit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbit_Fresh_Android_Project_v3.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project ZIP
        run: |
          unzip -o Orbit_Fresh_Android_Project_v3.zip -d extracted
          test -f extracted/TimeOrbit_Fresh/settings.gradle
          test -f extracted/TimeOrbit_Fresh/app/build.gradle

      - name: Build debug APK
        working-directory: extracted/TimeOrbit_Fresh
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Android-APK
          path: extracted/TimeOrbit_Fresh/app/build/outputs/apk/debug/app-debug.apk
