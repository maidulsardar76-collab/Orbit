
name: Build Orbit APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'Orbit_Responsive_Fixed_Source_v1.3_BridgeFix.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Orbit Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: Android SDK manager not found."
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract v1.3 source
        shell: bash
        run: |
          ZIP="Orbit_Responsive_Fixed_Source_v1.3_BridgeFix.zip"
          test -f "$ZIP"
          mkdir -p source
          unzip -q "$ZIP" -d source
          echo "ZIP extracted. Searching for Gradle project..."

          SETTINGS="$(find source -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No Gradle settings file found in the ZIP."
            find source -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: Android app manifest not found."
            find source -maxdepth 6 -type f | sort | head -200
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: App Gradle build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project located at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Find and verify APK
        shell: bash
        run: |
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/apk-output"
          cp "$APK" "$GITHUB_WORKSPACE/apk-output/Orbit-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/apk-output/Orbit-debug.apk"

      - name: Upload Orbit APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-v1.3-BridgeFix-APK
          path: apk-output/Orbit-debug.apk
          if-no-files-found: error
          retention-days: 30
          
