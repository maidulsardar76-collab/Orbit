
name: Build Orbit APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Orbit_Professional_Responsive_Update_v1.0.2.zip'
      - 'Orbit_Fresh_Android_Project_v3.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Select project ZIP
        id: project
        shell: bash
        run: |
          if [ -f Orbit_Professional_Responsive_Update_v1.0.2.zip ]; then
            echo "zip=Orbit_Professional_Responsive_Update_v1.0.2.zip" >> "$GITHUB_OUTPUT"
          elif [ -f Orbit_Fresh_Android_Project_v3.zip ]; then
            echo "zip=Orbit_Fresh_Android_Project_v3.zip" >> "$GITHUB_OUTPUT"
          else
            echo "Orbit project ZIP not found" >&2
            exit 1
          fi

      - name: Extract Android project
        run: |
          unzip -o "${{ steps.project.outputs.zip }}" -d extracted
          test -f extracted/TimeOrbit_Fresh/settings.gradle
          test -f extracted/TimeOrbit_Fresh/app/build.gradle

      - name: Build debug APK
        working-directory: extracted/TimeOrbit_Fresh
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Android-APK-v1.0.2
          path: extracted/TimeOrbit_Fresh/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
